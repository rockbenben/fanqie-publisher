name: CI

# 文档改动不触发：仓库里有整份 README 重构这类 doc-only 提交，跑测试没有意义。
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", ".gitignore"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", ".gitignore"]
  workflow_dispatch:

permissions:
  contents: read

# 同一分支的新推送取消旧的排队任务
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    # 3.10 是 README / run.bat 都声称的下限，必须真的跑过；
    # Windows 是主要用户平台（run.bat 双击启动），路径与编码差异只有它能暴露。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    env:
      # 测试里有中文输出；Windows runner 的控制台编码会让 print 抛
      # UnicodeEncodeError，那是环境问题不是代码问题。
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # 部分测试 import fanqie_gui，需要 tkinter 能 import（不需要显示器，
      # 没有任何测试会创建 Tk 窗口，所以不用 xvfb）。Windows 自带 tkinter。
      - name: 安装 tkinter (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - run: pip install -r requirements.txt

      # 不装浏览器内核：DOM 夹具测试无内核时会自动 SKIP，
      # 省掉每次约 150MB 下载。要跑它们请手动触发 browser-tests。
      - name: 回归测试
        shell: bash
        run: |
          for f in tests/test_*.py; do
            echo "::group::$f"
            python "$f" || { echo "::error::$f 失败"; exit 1; }
            echo "::endgroup::"
          done

      - name: 工具自检
        shell: bash
        run: |
          for t in remap keep_ahead clean_drafts; do
            python "tools/$t/$t.py" --self-check || exit 1
          done

      # argparse 挂了不会有测试报错，但用户第一条命令就跑不通
      - name: 子命令冒烟
        shell: bash
        run: |
          for s in login books upload remap audit clean-drafts reschedule; do
            python fanqie_upload.py "$s" -h > /dev/null || { echo "::error::$s -h 失败"; exit 1; }
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install pyflakes
      # pyflakes 而不是 flake8/ruff：这个仓库不追求风格统一，只要
      # 未使用的导入、未定义的名字、拼错的变量这类真错误。
      - run: pyflakes fanqie_gui.py fanqie_upload.py tools/*/*.py tests/*.py

  # 需要浏览器内核的 DOM 夹具测试：手动触发，不进每次推送。
  browser-tests:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y python3-tk
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: DOM 夹具测试
        run: |
          python tests/test_js_blocks_browser.py
          python tests/test_js_blocks_browser2.py
